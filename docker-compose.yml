# Local Postgres for QA Assistant. Not Neon. Dev credentials only; do not point this at production.

services:
  postgres:
    image: postgres:16
    container_name: qa-postgres
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://qa:qa@postgres:5432/qa?sslmode=disable
      STORAGE: neon
      QA_LISTEN_ALL: "1"
      WORK_DIR: /var/lib/qa/workdir
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - qa_backend_workdir:/var/lib/qa/workdir

volumes:
  qa_postgres_data:
  qa_backend_workdir:
