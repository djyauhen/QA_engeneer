# Installed by deploy/edge.sh. Private keys stay on the server in /etc/letsencrypt.
# Nest routes proxied to loopback: session, catalog, checks, reports, admin, health, preview, ai.

server {
    listen 80;
    server_name bdc-it.uk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bdc-it.uk;

    ssl_certificate /etc/letsencrypt/live/bdc-it.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bdc-it.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:QA:10m;

    root __DEPLOY_PATH__/frontend;
    index index.html;

    location /session {
        include /etc/nginx/snippets/qa_api_proxy.conf;
    }

    location /catalog {
        include /etc/nginx/snippets/qa_api_proxy.conf;
    }

    location /checks {
        include /etc/nginx/snippets/qa_api_proxy.conf;
    }

    location /reports {
        include /etc/nginx/snippets/qa_api_proxy.conf;
    }

    location /admin {
        include /etc/nginx/snippets/qa_api_proxy.conf;
    }

    location /health {
        include /etc/nginx/snippets/qa_api_proxy.conf;
    }

    location /preview {
        include /etc/nginx/snippets/qa_api_proxy.conf;
    }

    location /ai {
        include /etc/nginx/snippets/qa_api_proxy.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
